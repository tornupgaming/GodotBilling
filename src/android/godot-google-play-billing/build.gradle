plugins {
    id 'com.android.library'
}

ext.pluginVersionCode = 6
ext.pluginVersionName = "2.0.0"

android {
    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode pluginVersionCode
        versionName pluginVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    libraryVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "GodotGooglePlayBilling.$pluginVersionName.${variant.name}.aar"
        }
    }

    namespace 'org.godotengine.godot.plugin.googleplaybilling'
}

dependencies {
    compileOnly 'org.godotengine:godot:4.7.2.stable'
    implementation 'com.android.billingclient:billing:9.1.0'
}
